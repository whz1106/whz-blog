# NexT theme configuration overrides.
# Keep theme defaults in the npm package so upgrades remain safe.

scheme: Gemini
darkmode: true

menu:
  home: / || fa fa-home
  archives: /archives/ || fa fa-archive
  categories: /categories/ || fa fa-folder-open
  tags: /tags/ || fa fa-tags
  about: /about/ || fa fa-user
  rss: /feed.xml || fa fa-rss

social:
  GitHub: https://github.com/whz1106/whz-blog || fab fa-github

sidebar:
  position: right
  display: always

toc:
  enable: true
  number: false
  wrap: false
  expand_all: false
  max_depth: 4

codeblock:
  theme:
    light: default
    dark: stackoverflow-dark
  copy_button:
    enable: true
    style: flat
  language: true

back2top:
  enable: true
  sidebar: false
  scrollpercent: true

reading_progress:
  enable: true
  start_at: left
  position: top
  color: "#37c6c0"
  height: 3px

text_align:
  desktop: start
  mobile: start

avatar:
  rounded: true
  opacity: 1

creative_commons:
  license: by-nc-sa
  sidebar: true
  post: false
